# Reviewed licences of the FACE worker's Python environment (worker-face/pyproject.toml, uv.lock; M6/M7).
# Same format and checker as python-licenses.toml (the AI worker's): scripts/check-python-licenses.py
# --table scripts/python-licenses-face.toml. The policy and the full notes are in docs/LICENSES.md.
#
# The model files are not Python packages: they are fetched at build time into worker-face/models/
# (worker-face/scripts/fetch_models.py, pinned SHA-256) and listed under [[model]] below, which
# worker-face/tests/test_deploy_config.py keeps equal to verify_face/model_manifest.py.

# ---------------------------------------------------------------------------------------------------
# Runtime packages
# ---------------------------------------------------------------------------------------------------
[packages.ai-edge-litert]
version = "2.2.0"
metadata = "Apache Software License"
license = "Apache-2.0"
group = "runtime"
note = "LiteRT (TensorFlow Lite runtime) by Google AI Edge. The wheel ships no licence text: Apache-2.0 text and attribution in worker-face/NOTICE. Its declared dependencies tqdm, protobuf, ml-dtypes, backports-strenum, flatbuffers and typing-extensions are left out (pyproject override): the interpreter imports none of them."

[packages.onnxruntime]
version = "1.30.0"
metadata = "MIT License"
license = "MIT"
group = "runtime"

[packages.numpy]
version = "2.5.3"
metadata = "BSD-3-Clause AND 0BSD AND MIT AND Zlib AND CC0-1.0"
license = "BSD-3-Clause AND 0BSD AND MIT AND Zlib AND CC0-1.0"
group = "runtime"

[packages.pillow]
version = "12.3.0"
metadata = "MIT-CMU"
license = "MIT-CMU"
group = "runtime"

[packages.cryptography]
version = "50.0.2"
metadata = "Apache-2.0 OR BSD-3-Clause"
license = "Apache-2.0 OR BSD-3-Clause"
group = "runtime"

[packages.cffi]
version = "2.1.1"
metadata = "MIT-0"
license = "MIT-0"
group = "runtime"

[packages.pycparser]
version = "3.0"
metadata = "BSD-3-Clause"
license = "BSD-3-Clause"
group = "runtime"

[packages.packaging]
version = "26.3"
metadata = "Apache-2.0 OR BSD-2-Clause"
license = "Apache-2.0 OR BSD-2-Clause"
group = "runtime"

# ---------------------------------------------------------------------------------------------------
# Development only: tests and this check. Never installed on Vercel (uv sync --no-dev).
