name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  web:
    name: Web apps and Edge Functions (typecheck, lint, tests, build, licences)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run licenses
      - run: npm run typecheck
      # Deno comes from devDependencies (pinned in the lockfile). The workspace tsconfigs do not cover
      # supabase/functions and vitest does not type-check, so Deno checks the entrypoints and the tests.
      - name: Edge Functions type check (Deno)
        run: npx deno check supabase/functions/flow/index.ts supabase/functions/admin/index.ts supabase/functions/*/*.test.ts
      - name: Edge Functions lint (Deno)
        run: npx deno lint supabase/functions
      - run: npm test
      - run: npm run build

  e2e:
    name: Rider capture flow in Chromium (fake camera, emulated backend)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Playwright's own Chromium, matching the @playwright/test version in the lockfile.
      - run: npx playwright install --with-deps chromium
      # python3 (preinstalled) writes the fake camera videos; the tests build and serve the rider app.
      - run: npm run e2e
      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            e2e/out/report
            e2e/out/results
          retention-days: 14

  database:
    name: Database schema and security rules
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v6
      - run: scripts/test-db.sh
        env:
          DATABASE_URL: postgres://postgres:test@localhost:5432/postgres

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Run gitleaks
        env:
          GITLEAKS_VERSION: 8.29.1
        run: |
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar xz gitleaks
          ./gitleaks git --no-banner --redact --verbose .
