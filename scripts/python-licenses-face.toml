# ---------------------------------------------------------------------------------------------------
# Native files in the production environment (Linux x86_64 wheels, as Vercel installs them)
# ---------------------------------------------------------------------------------------------------
# LiteRT: the interpreter the worker uses, and the parts of the wheel it never loads.
[[native]]
path = "ai_edge_litert/libpywrap_litert_common.so"
component = "LiteRT shared runtime"
license = "Apache-2.0 AND LicenseRef-litert-third-party"
linking = "dynamic"
note = "As the Python bindings."

[[native]]
path = "ai_edge_litert/libLiteRt.so"
component = "LiteRT C API runtime"
license = "Apache-2.0 AND LicenseRef-litert-third-party"
linking = "dynamic"
note = "As the Python bindings."

[[native]]
path = "ai_edge_litert/libLiteRtWebGpuAccelerator.so"
component = "LiteRT WebGPU accelerator (Dawn; never loaded: CPU only)"
license = "Apache-2.0 AND BSD-3-Clause"
linking = "dynamic"

[[native]]
path = "ai_edge_litert/_pywrap_*"
component = "LiteRT's Python bindings: the interpreter (the worker's only use of LiteRT, XNNPACK on the CPU) and the converter, analyzer, calibration, metrics, compiled-model, environment, tensor-buffer and string bindings (never imported)"
license = "Apache-2.0 AND LicenseRef-litert-third-party"
linking = "static"
note = "TensorFlow Lite / LiteRT is Apache-2.0; compiled in, as in TensorFlow's own builds: Eigen (MPL-2.0), XNNPACK, cpuinfo, pthreadpool (BSD-2/BSD-3-Clause), ruy, gemmlowp, abseil, flatbuffers (Apache-2.0), FP16, farmhash (MIT), fft2d (Ooura, permissive), protobuf (BSD-3-Clause). All permissive or file-level copyleft."

[[native]]
path = "ai_edge_litert/tools/*"
component = "LiteRT command-line tools (plugin application, benchmarks; never run)"
license = "Apache-2.0 AND LicenseRef-litert-third-party"
linking = "static"
note = "As the Python bindings."

[[native]]
path = "ai_edge_litert/format_converter_wrapper_pybind11.so"
component = "LiteRT format converter binding (never imported)"
license = "Apache-2.0 AND BSD-3-Clause"
linking = "static"

[[native]]
path = "ai_edge_litert/pywrap_genai_ops.so"
component = "LiteRT generative-AI ops (never loaded)"
license = "Apache-2.0 AND LicenseRef-litert-third-party"
linking = "static"
note = "As the Python bindings."

[[native]]
path = "ai_edge_litert/vendors/*"
component = "LiteRT NPU compiler and dispatch plugins (Google Tensor, Intel OpenVINO, MediaTek, Qualcomm, Samsung; never loaded: CPU only)"
license = "Apache-2.0"
linking = "dynamic"
note = "Google's plugins; each loads its vendor's SDK at run time only when present, which never happens on Vercel. No vendor SDK is in the wheel."

[[native]]
path = "onnxruntime/datasets/*.onnx"
component = "ONNX Runtime's sample models (unused)"
