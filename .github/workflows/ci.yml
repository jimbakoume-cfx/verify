name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  web:
    name: Web apps and Edge Functions (typecheck, lint, tests, build, licences)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run licenses
      - run: npm run typecheck
      # Deno comes from devDependencies (pinned in the lockfile). The workspace tsconfigs do not cover
      # supabase/functions and vitest does not type-check, so Deno checks the entrypoints and the tests,
      # and the AI worker's test tools that run Edge Function code (worker/tests/tools).
      - name: Edge Functions type check (Deno)
        run: >-
          npx deno check supabase/functions/flow/index.ts supabase/functions/admin/index.ts
          supabase/functions/worker/index.ts supabase/functions/face/index.ts supabase/functions/*/*.test.ts
          worker/tests/tools/server_mrz.ts worker/tests/tools/server_worker.ts worker/tests/tools/server_consistency.ts
          worker-face/tests/tools/server_face.ts
      - name: Edge Functions lint (Deno)
        run: >-
          npx deno lint supabase/functions worker/tests/tools/server_mrz.ts worker/tests/tools/server_worker.ts
          worker/tests/tools/server_consistency.ts worker-face/tests/tools/server_face.ts
      - run: npm test
      - run: npm run build

  e2e:
    name: Rider capture flow in Chromium (fake camera, emulated backend)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Playwright's own Chromium, matching the @playwright/test version in the lockfile.
      - run: npx playwright install --with-deps chromium
      # python3 (preinstalled) writes the fake camera videos; the tests build and serve the rider app.
      - run: npm run e2e
      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            e2e/out/report
            e2e/out/results
          retention-days: 14

  database:
    name: Database schema and security rules
    runs-on: ubuntu-latest
    services:
      # The Supabase project runs PostgreSQL 17. The M3 migration needs 16 or later (IS JSON OBJECT).
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v6
      - run: scripts/test-db.sh
        env:
          DATABASE_URL: postgres://postgres:test@localhost:5432/postgres

  worker:
    name: AI worker (Python lock, tests with the real OCR models, licences)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v6
      # Node and the repo's pinned Deno (npx deno): the tests run the Edge Function code the worker
      # talks to (the worker function's signature checks and decisions, the shared MRZ corrector and
      # parser) instead of a re-implementation. WORKER_REQUIRE_DENO turns their skip into a failure.
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        working-directory: .
      # uv installs Python 3.12 (.python-version) and the locked dependencies, with their hashes.
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.11.32"
          enable-cache: true
          cache-dependency-glob: worker/uv.lock
      - name: The lock file matches pyproject.toml
        run: uv lock --check
      - run: uv sync --frozen
      - name: Tests, with the real RapidOCR models on the specimens
        run: uv run pytest
        env:
          WORKER_REQUIRE_DENO: "1"
      # The MRZ training's gate rules (training/mrz/py/gates.py): standard library only, so no
      # training environment is installed in CI.
      - name: MRZ model gate rules
        run: python3 -m unittest discover -s ../training/mrz/py -p "test_*.py"
      # What Vercel installs (no dev group), checked against the reviewed table: every package, and
      # every native library, extension module and model file in it (scripts/python-licenses.toml).
      - name: Python licences
        run: |
          UV_PROJECT_ENVIRONMENT="$RUNNER_TEMP/worker-prod" uv sync --frozen --no-dev
          uv run python ../scripts/check-python-licenses.py --prod-python "$RUNNER_TEMP/worker-prod/bin/python"

  worker-face:
    name: Face worker (Python lock, tests without the models, licences)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: worker-face
    steps:
      - uses: actions/checkout@v6
      # Node and the repo's pinned Deno: tests/test_edge_function.py runs the real face Edge Function.
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        working-directory: .
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.11.32"
          enable-cache: true
          cache-dependency-glob: worker-face/uv.lock
      - name: The lock file matches pyproject.toml
        run: uv lock --check
      - run: uv sync --frozen
      # The model files (AuraFace alone is 261 MB) are not fetched in CI: the tests marked `models` are
      # skipped here and run locally after scripts/fetch_models.py (docs/M6_SPEC.md, "Tests").
      - name: Tests, without the model files
        run: uv run pytest
        env:
          FACE_REQUIRE_DENO: "1"
      # The anti-spoofing manifest rules (training/antispoof/py/manifest.py): standard library only.
      - name: Anti-spoofing manifest rules
        run: python3 -m unittest discover -s ../training/antispoof/py -p "test_*.py"
      - name: Python licences
        run: |
          UV_PROJECT_ENVIRONMENT="$RUNNER_TEMP/face-prod" uv sync --frozen --no-dev
          uv run python ../scripts/check-python-licenses.py --prod-python "$RUNNER_TEMP/face-prod/bin/python" --table ../scripts/python-licenses-face.toml

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Run gitleaks
        env:
          GITLEAKS_VERSION: 8.29.1
        run: |
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar xz gitleaks
          ./gitleaks git --no-banner --redact --verbose .
