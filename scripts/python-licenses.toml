# Reviewed licences of the AI worker's Python environment (worker/pyproject.toml, worker/uv.lock).
# Checked in CI by scripts/check-python-licenses.py; the policy and the full notes are in
# docs/LICENSES.md. Every installed package, and every native file (shared library, extension module,
# model) in the production environment, must have a reviewed row here, at this exact version: an
# upgrade or a new dependency fails the check until someone has read its licence and updated this file.
#
# [packages."<name>"]: version installed; `metadata` is the licence exactly as pip-licenses reports it
# (`--from=mixed`), so a changed declaration is noticed; `license` is the reviewed SPDX expression;
# `group` is "runtime" (shipped to Vercel) or "dev" (tests and this check only, never shipped).
#
# [[native]]: `path` is a glob relative to site-packages ('*' also matches '/'), matching one or more
# files that are ELF binaries or ONNX models; `license` is the reviewed SPDX expression of what the
# file contains; `linking` is "dynamic" for a shared library loaded at run time (the only way an
# LGPL component is accepted), "static" for code compiled into an extension module, or "data" for a
# model; `sha256` pins a model file; LicenseRef-* needs a `note`.

